[project]
name = "scenerender"
version = "0.1.0"
description = "Generic Python renderer for scene-render 1.1 documents (schema/scene-render-1.1.xsd)."
requires-python = ">=3.10"
dependencies = ["lxml>=5", "numpy>=1.26", "pillow>=10", "imageio-ffmpeg>=0.5", "segno>=1.5", "shapely>=2",
                "pyphen>=0.14", "opencolorio>=2.5", "moderngl>=5.10", "rlottie-python>=1.3", "matplotlib>=3.8",
                "pygltflib>=1.16", "trimesh>=4"]

[project.optional-dependencies]
# pycairo and PyGObject (Pango/PangoCairo) are taken from the system site-packages;
# create the venv with `uv venv --system-site-packages`.
test = ["pytest>=8", "zxing-cpp>=3"]
# Data Matrix and PDF417 code assets (also used by the tests to decode every barcode kind).
codes = ["zxing-cpp>=3"]
# 3D asset formats and materials: USD/USDZ (usd-core), FBX (ufbx), OpenEXR environments, MaterialX.
3d = ["usd-core>=24", "ufbx>=0.0.5", "OpenEXR>=3", "MaterialX>=1.39"]

[project.scripts]
scenerender = "scenerender.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scenerender*"]

[tool.setuptools.package-data]
scenerender = ["schema/*.xsd"]
